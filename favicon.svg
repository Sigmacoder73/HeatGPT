<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(249, 115, 22, 0.4)" stroke-width="8"/>

  <!-- Outer Flame Body -->
  <path d="M 256 70 
           C 290 140, 370 210, 370 300 
           A 114 114 0 0 1 142 300 
           C 142 220, 210 160, 230 130 
           C 240 160, 260 170, 260 190 
           C 260 210, 240 220, 230 240 
           C 210 270, 230 330, 270 330 
           C 310 330, 330 280, 310 240 
           C 295 210, 270 180, 256 70 Z" 
        fill="url(#flameGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Core Flame -->
  <path d="M 256 250 
           C 270 280, 290 300, 290 330 
           A 34 34 0 0 1 222 330 
           C 222 300, 245 280, 256 250 Z" 
        fill="url(#innerGrad)"/>
</svg>
